<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Request Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2eb; --surface: #ffffff; --border: #e0dbd0;
  --text: #1a1814; --muted: #6b6659; --accent: #2d6a4f;
  --accent-light: #e8f5ee; --accent2: #c17c2a; --accent2-light: #fdf3e3;
  --danger: #c0392b; --danger-light: #fdecea; --purple: #534AB7; --purple-light: #EEEDFE;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1814;color:#f5f2eb;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.logo{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600}.logo span{color:#8bc4a8}
.hdr-right{display:flex;align-items:center;gap:10px}
#dot{width:8px;height:8px;border-radius:50%;background:#555;transition:background .3s}
#dot.on{background:#8bc4a8}
#status{font-size:11px;color:#aaa}
.btn{font-family:'DM Mono',monospace;font-size:11px;padding:5px 12px;border-radius:5px;border:1px solid #444;cursor:pointer;background:transparent;color:#aaa;transition:all .15s}
.btn:hover{background:#333;color:#f5f2eb}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#235c42}
.btn.export{background:var(--accent2-light);color:var(--accent2);border-color:#e8c98a}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stat{background:var(--surface);padding:14px 16px;text-align:center}
.stat-val{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:600;line-height:1;color:var(--accent)}
.stat-val.orange{color:var(--accent2)}.stat-val.red{color:var(--danger)}.stat-val.purple{color:var(--purple)}
.stat-label{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 2rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{font-family:'DM Mono',monospace;font-size:11px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:6px 10px;border-radius:5px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input{width:200px}
#rec-count{font-size:11px;color:var(--muted)}
.spacer{flex:1}

/* TABLE */
.wrap{overflow-x:auto;padding:1.5rem 2rem}
table{width:100%;border-collapse:collapse;font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
thead{background:#1a1814;color:#f5f2eb}
thead th{padding:9px 12px;text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
thead th:hover{background:#2d2d2a}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:#faf8f3}
td{padding:9px 12px;vertical-align:middle;white-space:nowrap}
.emp-no{font-weight:500;color:var(--accent);font-size:12px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.b-yes{background:var(--accent-light);color:#1b5e40}
.b-no{background:#f0ede8;color:#aaa}
.b-milk{background:var(--accent2-light);color:#7a4e10}
.b-plain{background:#E6F1FB;color:#0C447C}
.b-issued{background:#1b5e40;color:#fff}
.b-pending{background:#FAEEDA;color:#633806}
.b-skip{background:#f0ede8;color:#ccc}

/* ISSUE STATUS ROW */
.issue-cell{display:flex;flex-direction:column;gap:3px}
.issue-item{display:flex;align-items:center;gap:5px;font-size:10px}
.issue-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.id-issued{background:#27500A}.id-pending{background:#BA7517}.id-no{background:#ddd}

/* STATE */
.state-msg{text-align:center;padding:4rem;color:var(--muted);font-size:13px}
.icon{font-size:2.5rem;display:block;margin-bottom:1rem;opacity:.4}

/* TABS */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 2rem}
.tab-btn{padding:10px 16px;font-size:12px;font-family:'DM Mono',monospace;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

/* ISSUE PANEL */
.issue-panel{padding:1.5rem 2rem}
.issue-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem}
.issue-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.issue-name{font-size:14px;font-weight:500}
.issue-sub{font-size:11px;color:var(--muted);margin-top:2px}
.issue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.issue-box{background:var(--bg);border-radius:7px;padding:9px;text-align:center;border:1px solid var(--border)}
.issue-box-label{font-size:10px;color:var(--muted);margin-bottom:3px}
.issue-box-val{font-size:11px;font-weight:500;margin-bottom:6px}
.issue-box-btn{width:100%;padding:4px;border-radius:4px;font-size:10px;font-weight:500;border:none;cursor:pointer;font-family:'DM Mono',monospace}
.issue-box-btn.pending{background:#FAEEDA;color:#633806}
.issue-box-btn.issued{background:#27500A;color:#C0DD97;cursor:default}
.issue-box-btn.notreq{background:#f0ede8;color:#bbb;cursor:default}
.board-sep{font-size:10px;color:#BA7517;font-weight:500;margin:10px 0 6px;padding-top:10px;border-top:1px dashed var(--border)}
.issue-box.board{background:#fdf3e3;border-color:#e8c98a}
.search-issue{display:flex;gap:8px;margin-bottom:1.5rem}
.search-issue input{font-family:'DM Mono',monospace;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:6px;outline:none;flex:1}
.search-issue input:focus{border-color:var(--accent)}

@media(max-width:600px){header,.toolbar,.wrap,.issue-panel{padding-left:1rem;padding-right:1rem}.tabs{padding:0 1rem}}
</style>
</head>
<body>

<header>
  <div class="logo">Meal<span>Track</span></div>
  <div class="hdr-right">
    <span id="dot"></span><span id="status">connecting...</span>
    <button class="btn" onclick="loadData()">↻ Refresh</button>
    <button class="btn export" onclick="exportCSV()">↓ CSV</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-label">Total Records</div></div>
  <div class="stat"><div class="stat-val" id="s-tea1">—</div><div class="stat-label">Tea 01 Requests</div></div>
  <div class="stat"><div class="stat-val" id="s-lunch">—</div><div class="stat-label">Lunch Requests</div></div>
  <div class="stat"><div class="stat-val" id="s-tea2">—</div><div class="stat-label">Tea 02 Requests</div></div>
  <div class="stat"><div class="stat-val orange" id="s-bfast">—</div><div class="stat-label">Breakfast</div></div>
  <div class="stat"><div class="stat-val orange" id="s-dinner">—</div><div class="stat-label">Dinner</div></div>
  <div class="stat"><div class="stat-val red" id="s-pending">—</div><div class="stat-label">Pending Issues</div></div>
  <div class="stat"><div class="stat-val purple" id="s-issued">—</div><div class="stat-label">Fully Issued</div></div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('records')">📋 All Records</button>
  <button class="tab-btn" onclick="switchTab('issue')">🍽 Issue Meals</button>
</div>

<!-- RECORDS TAB -->
<div id="tab-records">
  <div class="toolbar">
    <input id="search" type="text" placeholder="Search emp no or name..." oninput="applyFilters()">
    <select id="f-shift" onchange="applyFilters()"><option value="">All Shifts</option><option>A</option><option>B</option><option>G</option></select>
    <select id="f-date" onchange="applyFilters()"><option value="">All Dates</option></select>
    <select id="f-dept" onchange="applyFilters()"><option value="">All Depts</option></select>
    <select id="f-issued" onchange="applyFilters()">
      <option value="">All Status</option>
      <option value="pending">Has Pending</option>
      <option value="full">Fully Issued</option>
    </select>
    <span class="spacer"></span>
    <span id="rec-count"></span>
  </div>
  <div class="wrap">
    <div id="state-area" class="state-msg"><span class="icon">⏳</span>Loading records...</div>
    <table id="data-table" style="display:none">
      <thead><tr>
        <th onclick="sortBy('emp_no')">Emp No</th>
        <th onclick="sortBy('emp_name')">Name</th>
        <th onclick="sortBy('emp_dept')">Dept</th>
        <th onclick="sortBy('emp_shift')">Shift</th>
        <th>Date</th>
        <th>Tea 01</th>
        <th>Lunch</th>
        <th>Tea 02</th>
        <th>Breakfast</th>
        <th>Dinner</th>
        <th>Boarding</th>
        <th>Issue Status</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- ISSUE TAB -->
<div id="tab-issue" style="display:none">
  <div class="issue-panel">
    <div class="search-issue">
      <input id="issue-search" type="text" placeholder="Type Employee Number e.g. 749 and press Enter..." onkeydown="if(event.key==='Enter')searchIssue()">
      <button class="btn primary" onclick="searchIssue()">Search</button>
    </div>
    <div id="issue-result"></div>
  </div>
</div>

<script>
const DB_URL = 'https://mealrequest-4a7b2-default-rtdb.firebaseio.com';
const TOKEN  = 'cIl1fGrefalNlfKp0doRL6mLlwN4CnLQRHYYydez';
const BUCKET = 'mealrequest';

let allRecords = [], sortCol = '_key', sortDir = -1;

// ── TAB SWITCH ────────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['records','issue'][i] === id));
  document.getElementById('tab-records').style.display = id === 'records' ? '' : 'none';
  document.getElementById('tab-issue').style.display   = id === 'issue'   ? '' : 'none';
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────
async function loadData() {
  setStatus('loading…', false);
  try {
    const res = await fetch(`${DB_URL}/${BUCKET}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status} — open Firebase Console → Realtime Database → Rules → publish .read:true`);
    const data = await res.json();
    if (!data) { allRecords = []; renderTable([]); setStatus('0 records', true); return; }

    allRecords = Object.entries(data).map(([key, val]) => {
      let r = val;
      if (typeof r === 'string') { try { r = JSON.parse(r); } catch(e) { r = {}; } }
      if (typeof r === 'string') { try { r = JSON.parse(r); } catch(e) { r = {}; } }
      // normalise common field variants
      r.emp_no   = r.emp_no   || r.empNo   || '';
      r.emp_name = r.emp_name || r.empName || '';
      r.emp_dept = r.emp_dept || r.dept    || '';
      r.emp_shift= r.emp_shift|| r.shift   || '';
      r['Tea 01']= r['Tea 01']|| r.tea1    || r['Morning Tea'] || '';
      r['Tea 02']= r['Tea 02']|| r.tea2    || r['Afyernoon Tea']|| r['Afternoon Tea'] || '';
      r['Lunch'] = r['Lunch'] || '';
      r['Breakfast'] = r['Breakfast'] || '';
      r['Dinner']    = r['Dinner']    || '';
      r['Tea 01 Issued']  = r['Tea 01 Issued']  || r['Morning Tea Issued']   || 'No';
      r['Tea 02 Issued']  = r['Tea 02 Issued']  || r['Afternoon Tea Issued'] || 'No';
      r['Lunch Issued']   = r['Lunch Issued']   || 'No';
      r['Breakfast Issued']= r['Breakfast Issued']|| 'No';
      r['Dinner Issued']  = r['Dinner Issued']  || 'No';
      r['Boarding']       = r['Boarding']       || '';
      // extract date from key if structured key
      r._key = key;
      r._date = extractDate(key, r);
      return r;
    }).filter(r => r.emp_no !== '');  // skip blank records

    populateFilters();
    applyFilters();
    setStatus(`connected — ${allRecords.length} records`, true);
  } catch(e) {
    setState('error', e.message);
    setStatus('error', false);
  }
}

function extractDate(key, r) {
  // try structured key like 749_A_May8_2026
  const m = key.match(/_([A-Z][a-z]+\d+_\d{4})$/);
  if (m) return m[1].replace('_', ' ');
  // fallback to field dates
  return r['Tea 01 Date'] || r['Lunch Date'] || r['Breakfast Date'] || '';
}

// ── FILTERS ───────────────────────────────────────────────────────────────
function populateFilters() {
  const depts  = [...new Set(allRecords.map(r => r.emp_dept).filter(Boolean))].sort();
  const dates  = [...new Set(allRecords.map(r => r._date).filter(Boolean))].sort().reverse();
  const dSel = document.getElementById('f-dept');
  dSel.innerHTML = '<option value="">All Depts</option>' + depts.map(d => `<option>${d}</option>`).join('');
  const dtSel = document.getElementById('f-date');
  dtSel.innerHTML = '<option value="">All Dates</option>' + dates.map(d => `<option>${d}</option>`).join('');
}

function applyFilters() {
  const q  = document.getElementById('search').value.toLowerCase();
  const sh = document.getElementById('f-shift').value;
  const dt = document.getElementById('f-date').value;
  const dp = document.getElementById('f-dept').value;
  const is = document.getElementById('f-issued').value;

  let f = allRecords.filter(r => {
    if (q  && !`${r.emp_no} ${r.emp_name}`.toLowerCase().includes(q)) return false;
    if (sh && r.emp_shift !== sh) return false;
    if (dt && r._date !== dt) return false;
    if (dp && r.emp_dept !== dp) return false;
    if (is === 'pending' && !hasPending(r)) return false;
    if (is === 'full'    && !fullyIssued(r)) return false;
    return true;
  });

  f = [...f].sort((a,b) => {
    const av = (a[sortCol]||'').toString().toLowerCase();
    const bv = (b[sortCol]||'').toString().toLowerCase();
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  renderTable(f);
  updateStats(f);
  document.getElementById('rec-count').textContent = `${f.length} of ${allRecords.length} records`;
}

function hasPending(r) {
  const checks = [
    [r['Tea 01'], r['Tea 01 Issued']],
    [r['Lunch'],  r['Lunch Issued']],
    [r['Tea 02'], r['Tea 02 Issued']],
    [r['Breakfast'], r['Breakfast Issued']],
    [r['Dinner'], r['Dinner Issued']],
  ];
  return checks.some(([req, iss]) => req && req !== 'No' && req !== '' && iss !== 'Yes');
}

function fullyIssued(r) {
  const checks = [
    [r['Tea 01'], r['Tea 01 Issued']],
    [r['Lunch'],  r['Lunch Issued']],
    [r['Tea 02'], r['Tea 02 Issued']],
    [r['Breakfast'], r['Breakfast Issued']],
    [r['Dinner'], r['Dinner Issued']],
  ];
  const requested = checks.filter(([req]) => req && req !== 'No' && req !== '');
  if (requested.length === 0) return false;
  return requested.every(([,iss]) => iss === 'Yes');
}

// ── STATS ─────────────────────────────────────────────────────────────────
function updateStats(r) {
  const yes = v => v && v !== 'No' && v !== '';
  document.getElementById('s-total').textContent   = allRecords.length;
  document.getElementById('s-tea1').textContent    = r.filter(x => yes(x['Tea 01'])).length;
  document.getElementById('s-lunch').textContent   = r.filter(x => yes(x['Lunch'])).length;
  document.getElementById('s-tea2').textContent    = r.filter(x => yes(x['Tea 02'])).length;
  document.getElementById('s-bfast').textContent   = r.filter(x => yes(x['Breakfast'])).length;
  document.getElementById('s-dinner').textContent  = r.filter(x => yes(x['Dinner'])).length;
  document.getElementById('s-pending').textContent = r.filter(hasPending).length;
  document.getElementById('s-issued').textContent  = r.filter(fullyIssued).length;
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────
function mealBadge(val) {
  if (!val || val === 'No' || val === '') return `<span class="badge b-no">No</span>`;
  if (val === 'Yes') return `<span class="badge b-yes">Yes</span>`;
  if (val.toUpperCase() === 'MILK')  return `<span class="badge b-milk">MILK</span>`;
  if (val.toUpperCase() === 'PLAIN') return `<span class="badge b-plain">PLAIN</span>`;
  return `<span class="badge b-yes">${esc(val)}</span>`;
}

function issueBadge(req, iss) {
  if (!req || req === 'No' || req === '') return `<span class="badge b-skip">—</span>`;
  if (iss === 'Yes') return `<span class="badge b-issued">✓ Issued</span>`;
  return `<span class="badge b-pending">Pending</span>`;
}

function renderTable(records) {
  if (!records.length) { setState('empty'); document.getElementById('data-table').style.display = 'none'; return; }
  document.getElementById('state-area').style.display = 'none';
  document.getElementById('data-table').style.display = 'table';
  document.getElementById('tbody').innerHTML = records.map(r => `
    <tr>
      <td class="emp-no">${esc(r.emp_no)}</td>
      <td>${esc(r.emp_name)}</td>
      <td class="muted">${esc(r.emp_dept)}</td>
      <td>${esc(r.emp_shift)}</td>
      <td class="muted">${esc(r._date)}</td>
      <td>${mealBadge(r['Tea 01'])} ${issueBadge(r['Tea 01'], r['Tea 01 Issued'])}</td>
      <td>${mealBadge(r['Lunch'])} ${issueBadge(r['Lunch'], r['Lunch Issued'])}</td>
      <td>${mealBadge(r['Tea 02'])} ${issueBadge(r['Tea 02'], r['Tea 02 Issued'])}</td>
      <td>${mealBadge(r['Breakfast'])} ${issueBadge(r['Breakfast'], r['Breakfast Issued'])}</td>
      <td>${mealBadge(r['Dinner'])} ${issueBadge(r['Dinner'], r['Dinner Issued'])}</td>
      <td>${r['Boarding'] ? `<span class="badge b-yes">${esc(r['Boarding'])}</span>` : '<span class="badge b-no">—</span>'}</td>
      <td>${hasPending(r) ? '<span class="badge b-pending">⚠ Pending</span>' : fullyIssued(r) ? '<span class="badge b-issued">✓ Done</span>' : '<span class="badge b-no">—</span>'}</td>
    </tr>`).join('');
}

// ── ISSUE TAB ─────────────────────────────────────────────────────────────
function searchIssue() {
  const empNo = document.getElementById('issue-search').value.trim();
  if (!empNo) return;
  const today = formatKeyDate(new Date());
  const shifts = ['A','B','G'];
  let found = null;
  // search all shifts for today
  for (const sh of shifts) {
    const key = `${empNo}_${sh}_${today}`;
    const rec = allRecords.find(r => r._key === key);
    if (rec) { found = rec; break; }
  }
  // fallback: search by emp_no any date
  if (!found) found = allRecords.filter(r => r.emp_no === empNo).sort((a,b) => b._key > a._key ? 1 : -1)[0];

  const div = document.getElementById('issue-result');
  if (!found) {
    div.innerHTML = `<div class="state-msg"><span class="icon">🔍</span>No record found for employee ${esc(empNo)} today.</div>`;
    return;
  }
  renderIssueCard(found, div);
}

function formatKeyDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]}${d.getDate()}_${d.getFullYear()}`;
}

function renderIssueCard(r, div) {
  const meals = [
    { label:'Tea 01',   req: r['Tea 01'],    iss: r['Tea 01 Issued'],   field:'Tea 01 Issued',   board:false },
    { label:'Lunch',    req: r['Lunch'],      iss: r['Lunch Issued'],    field:'Lunch Issued',    board:false },
    { label:'Tea 02',   req: r['Tea 02'],     iss: r['Tea 02 Issued'],   field:'Tea 02 Issued',   board:false },
    { label:'Breakfast',req: r['Breakfast'],  iss: r['Breakfast Issued'],field:'Breakfast Issued',board:true  },
    { label:'Dinner',   req: r['Dinner'],     iss: r['Dinner Issued'],   field:'Dinner Issued',   board:true  },
  ];

  const shiftMeals  = meals.filter(m => !m.board);
  const boardMeals  = meals.filter(m => m.board);
  const hasBoarding = r['Boarding'] && r['Boarding'] !== '' && r['Boarding'].toLowerCase() !== 'no';

  function mealBox(m) {
    const requested = m.req && m.req !== 'No' && m.req !== '';
    const issued    = m.iss === 'Yes';
    const btnClass  = !requested ? 'notreq' : issued ? 'issued' : 'pending';
    const btnText   = !requested ? 'Not Requested' : issued ? '✓ Issued' : 'Issue ✓';
    const onclick   = (!requested || issued) ? '' : `onclick="issueItem('${r._key}','${m.field}',this)"`;
    return `<div class="issue-box${m.board?' board':''}">
      <div class="issue-box-label">${m.label}</div>
      <div class="issue-box-val">${m.req||'No'}</div>
      <button class="issue-box-btn ${btnClass}" ${onclick}>${btnText}</button>
    </div>`;
  }

  div.innerHTML = `
    <div class="issue-card">
      <div class="issue-card-header">
        <div>
          <div class="issue-name">${esc(r.emp_name)} — EMP ${esc(r.emp_no)}</div>
          <div class="issue-sub">${esc(r.emp_shift)} Shift · ${esc(r.emp_dept)} · ${esc(r._date)} ${hasBoarding ? '· 🏠 Boarding' : ''}</div>
        </div>
      </div>
      <div class="issue-grid">${shiftMeals.map(mealBox).join('')}</div>
      ${hasBoarding ? `<div class="board-sep">🏠 Boarding Meals</div><div class="issue-grid">${boardMeals.map(mealBox).join('')}</div>` : ''}
    </div>`;
}

async function issueItem(key, field, btn) {
  btn.textContent = 'Saving...';
  btn.disabled = true;
  try {
    const path = `${DB_URL}/${BUCKET}/${key}/${field}.json`;
    await fetch(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body:'"Yes"' });
    btn.textContent = '✓ Issued';
    btn.className = 'issue-box-btn issued';
    // update local record
    const rec = allRecords.find(r => r._key === key);
    if (rec) rec[field] = 'Yes';
  } catch(e) {
    btn.textContent = 'Error — retry';
    btn.disabled = false;
  }
}

// ── SORT ──────────────────────────────────────────────────────────────────
function sortBy(col) {
  sortDir = sortCol === col ? sortDir * -1 : 1;
  sortCol = col;
  applyFilters();
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function exportCSV() {
  if (!allRecords.length) return;
  const h = ['emp_no','emp_name','emp_dept','emp_shift','_date','Tea 01','Tea 01 Issued','Lunch','Lunch Issued','Tea 02','Tea 02 Issued','Breakfast','Breakfast Issued','Dinner','Dinner Issued','Boarding'];
  const rows = allRecords.map(r => h.map(k => `"${(r[k]||'').toString().replace(/"/g,'""')}"`).join(','));
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent([h.join(','),...rows].join('\n'));
  a.download = `meal_records_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function setState(s, msg) {
  const a = document.getElementById('state-area');
  a.style.display = 'block';
  document.getElementById('data-table').style.display = 'none';
  if (s==='empty')   a.innerHTML = '<span class="icon">📭</span>No records match filters.';
  else if (s==='error') a.innerHTML = `<span class="icon">⚠</span>Could not load data.<br><small style="color:#c0392b">${msg}</small><br><br>Check Firebase rules — set .read: true`;
}
function setStatus(msg, on) {
  document.getElementById('status').textContent = msg;
  document.getElementById('dot').className = on ? 'on' : '';
}
loadData();

// Auto refresh every 1 minute (60000 ms)
setInterval(() => {
  loadData();
}, 60000);

</script>
